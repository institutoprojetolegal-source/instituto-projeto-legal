
name: Limpeza da Branch Codespaces

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Remover arquivos desnecessarios
        run: |
          git rm -r --cached --ignore-unmatch node_modules .next .vscode
          git rm --cached --ignore-unmatch audit-report.json

      - name: Atualizar gitignore
        run: |
          touch .gitignore
          for item in /node_modules/ /.next/ /.vscode/ /audit-report.json; do
            grep -qxF "$item" .gitignore || echo "$item" >> .gitignore
          done

      - name: Salvar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Remove arquivos gerados da branch"
            git push
          fi
